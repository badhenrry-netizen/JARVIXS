<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#0A0D11">
<title>JARVIS SCIENTIST — Advanced Scientific Research System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root{
    --bg: #0A0D11;
    --bg-panel: #10151B;
    --bg-panel-2: #141B22;
    --bg-raised: #182029;
    --line: #1F2932;
    --line-bright: #2E3B46;
    --text: #E4EAEE;
    --text-dim: #8B99A6;
    --text-faint: #57646F;
    --accent: #4C8DFF;
    --accent-soft: rgba(76,141,255,0.12);
    --positive: #6FE0C0;
    --positive-soft: rgba(111,224,192,0.1);
    --amber: #E3A34E;
    --amber-soft: rgba(227,163,78,0.1);
    --violet: #A594E8;
    --violet-soft: rgba(165,148,232,0.1);
    --coral: #E3766F;
    --coral-soft: rgba(227,118,111,0.1);
    --radius-sm: 5px;
    --radius: 9px;
    --radius-lg: 14px;
    --sidebar-w: 232px;
    --sidebar-w-collapsed: 68px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; overscroll-behavior:none; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .display{ font-family:'Space Grotesk', sans-serif; }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  button, input, select, textarea{ font-family: inherit; color: inherit; }
  button{ cursor:pointer; background:none; border:none; }
  ::selection{ background: var(--accent-soft); }
  a{ color: var(--accent); text-decoration:none; }

  /* subtle ambient grid on the deep background */
  body::before{
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; opacity: 0.15;
  }

  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color: var(--text-faint); }
  .badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px 3px 7px;
    border-radius:20px; border:1px solid var(--line-bright); color: var(--text-dim); white-space:nowrap;
  }
  .badge .dot{ width:5px; height:5px; border-radius:50%; background: currentColor; }
  .badge.demo{ color: var(--amber); border-color: rgba(227,163,78,0.35); background: var(--amber-soft); }
  .badge.online{ color: var(--positive); border-color: rgba(111,224,192,0.35); background: var(--positive-soft); }
  .badge.violet{ color: var(--violet); border-color: rgba(165,148,232,0.35); background: var(--violet-soft); }

  /* ---------- APP SHELL ---------- */
  #app{ position:relative; z-index:1; display:flex; height:100vh; height:100dvh; }

  /* Sidebar — fixed rail on tablet/notebook/desktop, slide-in drawer on phone */
  #sidebar{
    width: var(--sidebar-w); flex-shrink:0; background: var(--bg-panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    transition: width 0.22s ease; overflow:hidden;
  }
  #sidebar.collapsed{ width: var(--sidebar-w-collapsed); }

  #sidebarOverlay{ position:fixed; inset:0; background:rgba(6,9,12,0.6); z-index:39; display:none; }
  #sidebarOverlay.open{ display:block; }

  @media (max-width: 767px){
    #sidebar{
      position:fixed; top:0; left:0; bottom:0; z-index:40; width: min(78vw, 280px);
      transform: translateX(-100%); transition: transform 0.22s ease; border-right:1px solid var(--line-bright);
    }
    #sidebar.mobile-open{ transform: translateX(0); }
    #sidebar.collapsed{ width: min(78vw, 280px); } /* collapse state is meaningless on phone — always full drawer */
    #sidebar.collapsed .sb-item span.label,
    #sidebar.collapsed .sb-brand .name{ display:block; }
    #sidebar.collapsed .sb-item{ justify-content:flex-start; }
    .sb-hide-mobile{ display:none !important; }
  }
  @media (min-width: 768px){ .sb-mobile-toggle{ display:none !important; } }
  .sb-brand{
    display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid var(--line);
    flex-shrink:0; min-height:64px;
  }
  .sb-brand .mark{
    width:30px; height:30px; border-radius:8px; background: linear-gradient(135deg, var(--accent), var(--violet));
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:#06090C;
  }
  .sb-brand .name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; white-space:nowrap; }
  .sb-brand .name span{ color: var(--text-dim); font-weight:500; }
  #sidebar.collapsed .sb-brand .name{ display:none; }

  .sb-nav{ flex:1; overflow-y:auto; padding: 10px 10px; }
  .sb-item{
    display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:var(--radius-sm);
    color: var(--text-dim); font-size:13px; font-weight:500; margin-bottom:2px; text-align:left;
    transition: background 0.15s, color 0.15s; white-space:nowrap;
  }
  .sb-item:hover{ background: var(--bg-raised); color: var(--text); }
  .sb-item.active{ background: var(--accent-soft); color: var(--accent); }
  .sb-item .ic{ width:17px; height:17px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .sb-item .ic svg{ width:100%; height:100%; }
  #sidebar.collapsed .sb-item span.label{ display:none; }
  #sidebar.collapsed .sb-item{ justify-content:center; }

  .sb-foot{ padding:12px 10px; border-top:1px solid var(--line); flex-shrink:0; }
  .sb-toggle{
    display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:var(--radius-sm);
    color: var(--text-faint); font-size:12px;
  }
  .sb-toggle:hover{ background: var(--bg-raised); color: var(--text-dim); }

  /* Main column */
  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }

  /* Topbar */
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 14px 24px; border-bottom:1px solid var(--line); flex-shrink:0; background: rgba(10,13,17,0.7);
    backdrop-filter: blur(8px);
  }
  .tb-left{ display:flex; align-items:center; gap:14px; min-width:0; }
  .tb-title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; white-space:nowrap; }
  .tb-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .tb-stat{ font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--text-faint); display:flex; gap:5px; align-items:center; }
  .tb-stat b{ color: var(--text-dim); font-weight:500; }
  .tb-right{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .sb-mobile-toggle{ width:34px; height:34px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0; }
  .sb-mobile-toggle:hover{ background: var(--bg-raised); }
  @media (max-width: 767px){
    #topbar{ padding:12px 14px; }
    .tb-title{ font-size:14.5px; }
    .tb-stat:not(:first-child){ display:none; } /* keep topbar from wrapping to 3 lines on a phone */
  }
  @media (min-width: 768px) and (max-width: 1023px){ #topbar{ padding:13px 18px; } }

  /* Content area */
  #content{ flex:1; overflow-y:auto; padding: 24px; }
  @media (max-width: 767px){ #content{ padding:14px; } }
  @media (min-width: 768px) and (max-width: 1023px){ #content{ padding:18px; } }
  @media (min-width: 1920px){ #content{ padding:28px 40px; } }

  .page{ animation: fadein 0.28s ease; max-width: 1400px; }
  @media (min-width: 1920px){ .page{ max-width: 1600px; margin:0 auto; } }
  @keyframes fadein{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform:none; } }

  .page-head{ margin-bottom:22px; }
  .page-head h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:22px; margin-bottom:6px; }
  .page-head p{ color: var(--text-dim); font-size:13px; max-width: 62ch; }

  /* Cards / grids — fluid, responds to real available width rather than a fixed per-device column count */
  .grid{ display:grid; gap:14px; }
  .grid.cols-6{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid.cols-3{ grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .grid.cols-2{ grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  @media (max-width: 480px){ .grid.cols-6, .grid.cols-3, .grid.cols-2{ grid-template-columns: 1fr; } }

  .card{
    background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 16px; transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover{ border-color: var(--line-bright); }
  .stat-card .eyebrow{ margin-bottom:10px; }
  .stat-card .value{ font-family:'Space Grotesk',sans-serif; font-size:28px; font-weight:600; margin-bottom:4px; }
  .stat-card .foot{ font-size:11.5px; color: var(--text-faint); }

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-faint); margin: 26px 0 12px; display:flex; align-items:center; gap:10px;
  }
  .section-label::after{ content:''; flex:1; height:1px; background: var(--line); }
  .section-label:first-child{ margin-top:0; }

  /* Strategy / source / discovery cards */
  .strategy-card{ display:flex; flex-direction:column; gap:10px; }
  .strategy-card .head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .strategy-card .title{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; }
  .strategy-card .mech{ font-size:12.5px; color: var(--text-dim); line-height:1.5; }
  .kv-row{ display:flex; justify-content:space-between; font-size:11.5px; padding:5px 0; border-top:1px solid var(--line); }
  .kv-row .k{ color: var(--text-faint); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.04em; font-size:10px; }
  .kv-row .v{ color: var(--text-dim); font-family:'IBM Plex Mono',monospace; }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-faint); padding:10px 12px; border-bottom:1px solid var(--line-bright); }
  td{ padding:12px; border-bottom:1px solid var(--line); font-size:13px; }
  tr:last-child td{ border-bottom:none; }
  .rank-table{ background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius); overflow:hidden; }

  /* Evidence badges E0-E6 */
  .ev-badge{ font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; padding:3px 8px; border-radius:4px; display:inline-block; }
  .ev-0{ background: rgba(87,100,111,0.15); color: var(--text-faint); }
  .ev-1{ background: var(--violet-soft); color: var(--violet); }
  .ev-2{ background: var(--amber-soft); color: var(--amber); }
  .ev-3{ background: var(--amber-soft); color: var(--amber); }
  .ev-4{ background: var(--accent-soft); color: var(--accent); }
  .ev-5{ background: var(--positive-soft); color: var(--positive); }
  .ev-6{ background: var(--positive-soft); color: var(--positive); }

  /* HIV Map — signature element */
  .hivmap-wrap{ display:flex; gap:22px; }
  .hivmap-pipeline{ display:flex; flex-direction:column; gap:0; flex-shrink:0; width: 280px; }
  .hivmap-stage{
    display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:var(--radius-sm);
    border:1px solid transparent; text-align:left; position:relative;
  }
  .hivmap-stage:hover{ background: var(--bg-raised); }
  .hivmap-stage.active{ background: var(--accent-soft); border-color: rgba(76,141,255,0.3); }
  .hivmap-stage .n{ font-family:'IBM Plex Mono',monospace; font-size:10px; color: var(--text-faint); width:18px; flex-shrink:0; }
  .hivmap-stage.active .n{ color: var(--accent); }
  .hivmap-stage .label{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; }
  .hivmap-connector{ width:1px; height:14px; background: var(--line-bright); margin-left:23px; }
  .hivmap-detail{
    flex:1; background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius-lg); padding:26px;
    min-height: 420px;
  }
  .hivmap-detail h2{ font-family:'Space Grotesk',sans-serif; font-size:20px; margin-bottom:8px; }
  .hivmap-detail .desc{ color: var(--text-dim); font-size:13.5px; line-height:1.7; margin-bottom:20px; max-width:60ch; }
  @media (max-width: 1023px){ .hivmap-wrap{ flex-direction:column; } .hivmap-pipeline{ width:100%; flex-direction:row; overflow-x:auto; padding-bottom:4px; } .hivmap-connector{ display:none; } .hivmap-stage{ flex-shrink:0; } .hivmap-detail{ min-height:280px; } }

  /* Chat */
  .chat-panel{ display:flex; flex-direction:column; height: 100%; min-height:420px; background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius-lg); overflow:hidden; }
  .chat-log{ flex:1; overflow-y:auto; padding: 20px; display:flex; flex-direction:column; gap:14px; min-height:0; }
  .msg{ max-width: 78%; padding:12px 14px; border-radius: var(--radius); font-size:13.5px; line-height:1.6; }
  .msg.user{ align-self:flex-end; background: var(--accent); color:#06090C; font-weight:500; }
  .msg.jarvis{ align-self:flex-start; background: var(--bg-raised); border:1px solid var(--line-bright); }
  .msg.jarvis .who{ font-family:'IBM Plex Mono',monospace; font-size:10px; color: var(--accent); letter-spacing:0.08em; margin-bottom:6px; display:block; }
  .chat-input-row{ display:flex; gap:8px; padding:14px; border-top:1px solid var(--line); flex-shrink:0; align-items:flex-end; }
  .chat-input-row textarea{
    flex:1; background: var(--bg); border:1px solid var(--line-bright); border-radius: var(--radius-sm);
    padding:11px 13px; resize:none; font-size:16px; max-height:100px;
  }
  /* font-size:16px above is deliberate — iOS Safari auto-zooms on inputs under 16px, which would break the layout */
  .chat-input-row textarea:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .icon-btn{ width:38px; height:38px; border-radius: var(--radius-sm); border:1px solid var(--line-bright); display:flex; align-items:center; justify-content:center; color: var(--text-dim); flex-shrink:0; }
  .icon-btn:hover{ background: var(--bg-raised); color: var(--text); }
  .send-btn{ width:38px; height:38px; border-radius: var(--radius-sm); background: var(--accent); color:#06090C; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .send-btn:hover{ background:#6BA0FF; }
  @media (max-width: 767px){ .msg{ max-width:88%; } .chat-input-row textarea{ padding:10px 12px; } }

  /* forms */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color: var(--text-faint); margin-bottom:6px; }
  .field textarea, .field input[type=text], .field select{
    width:100%; background: var(--bg); border:1px solid var(--line-bright); border-radius: var(--radius-sm);
    padding: 11px 13px; font-size:13.5px;
  }
  .field textarea:focus, .field input:focus, .field select:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .btn-primary{ background: var(--accent); color:#06090C; padding:11px 20px; border-radius: var(--radius-sm); font-weight:600; font-size:13px; }
  .btn-primary:hover{ background:#6BA0FF; }
  .btn-secondary{ border:1px solid var(--line-bright); color: var(--text-dim); padding:10px 18px; border-radius: var(--radius-sm); font-size:13px; }
  .btn-secondary:hover{ color: var(--text); border-color: var(--text-dim); }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--text-faint); }
  .empty-state .ic{ font-size:26px; margin-bottom:10px; }
  .empty-state p{ font-size:13px; max-width:40ch; margin:0 auto; }

  /* ---------- HOME BENTO LAYOUT (Scientific Command Center) ---------- */
  .bento{ display:flex; flex-direction:column; gap:14px; }
  .bento-row{ display:flex; flex-direction:column; gap:14px; }
  .bento-main{ min-width:0; }
  .bento-side{ min-width:0; }

  /* From tablet/notebook width up, the assistant/status and map/ranking rows go two-up,
     with the primary panel wider than the side panel — matches the reference command-center layout. */
  @media (min-width: 1024px){
    .bento-row{ flex-direction:row; align-items:stretch; }
    .bento-main{ flex: 1.7 1 0; }
    .bento-side{ flex: 1 1 0; }
  }

  .side-panel{ background: var(--bg-panel); border:1px solid var(--line); border-radius: var(--radius-lg); padding:20px; height:100%; }
  .status-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .status-row:last-child{ border-bottom:none; }
  .status-row .k{ color: var(--text-dim); }
  .status-row .v{ font-family:'IBM Plex Mono',monospace; color: var(--text-faint); font-size:11.5px; }

  .preview-list{ display:flex; flex-direction:column; gap:2px; }
  .preview-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .preview-row:last-child{ border-bottom:none; }
  .see-more{ display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace; font-size:11px; color: var(--accent); margin-top:12px; letter-spacing:0.04em; text-transform:uppercase; }

  .hivmap-preview-pipeline{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .mini-stage{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color: var(--text-dim); border:1px solid var(--line-bright); border-radius:20px; padding:5px 10px; }
  .mini-stage.active{ color: var(--accent); border-color: rgba(76,141,255,0.4); background: var(--accent-soft); }

  @media (max-width: 767px){ .side-panel{ padding:16px; } }

  /* Drawer (side panel for HIV stage / evidence detail) */
  .drawer-overlay{ position:fixed; inset:0; background: rgba(6,9,12,0.6); z-index:50; display:none; }
  .drawer-overlay.open{ display:block; }
  .drawer{
    position:fixed; top:0; right:0; bottom:0; width:min(420px,88vw); background: var(--bg-panel);
    border-left:1px solid var(--line-bright); z-index:51; transform: translateX(100%); transition: transform 0.25s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform: translateX(0); }
  .drawer-head{ display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
  .drawer-body{ padding:20px; overflow-y:auto; flex:1; }
  .drawer-body h3{ font-family:'Space Grotesk',sans-serif; font-size:18px; margin-bottom:10px; }
  .drawer-body .desc{ font-size:13px; color: var(--text-dim); line-height:1.7; margin-bottom:18px; }

  /* Settings toggles */
  .toggle-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row .t-label{ font-size:13.5px; font-weight:500; }
  .toggle-row .t-desc{ font-size:12px; color: var(--text-faint); margin-top:2px; }
  .switch{ width:40px; height:22px; border-radius:20px; background: var(--line-bright); position:relative; flex-shrink:0; }
  .switch.on{ background: var(--accent); }
  .switch::after{ content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition: transform 0.15s; }
  .switch.on::after{ transform: translateX(18px); }

  /*
    Sistema de breakpoints (responde à largura real, não ao nome do dispositivo):
    < 768        MOBILE
    768 – 1023   TABLET
    1024 – 1279  LARGE TABLET / SMALL NOTEBOOK  (inclui iPad Pro 12.9" landscape, 1366×1024)
    1280 – 1599  NOTEBOOK
    1600 – 1919  LARGE NOTEBOOK / DESKTOP
    >= 1920      DESKTOP / ULTRAWIDE (conteúdo central limitado, ver .page acima)
  */
  @media (min-width: 768px) and (max-width: 1023px){
    .stat-card .value{ font-size:24px; }
  }
  @media (min-width: 1024px) and (max-width: 1279px){
    #content{ padding:20px; }
  }
  @media (min-width: 1600px){
    .grid.cols-6{ grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); }
  }
  ::-webkit-scrollbar-thumb{ background: var(--line-bright); border-radius:4px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div id="app">
  <div id="sidebarOverlay"></div>
  <aside id="sidebar">
    <div class="sb-brand">

function renderSidebar(){
  const nav = document.getElementById('sbNav');

  document.getElementById('sbToggle').querySelector('.ic').innerHTML = ICONS.collapse;
}

  const navItem = NAV.find(n=>n.id===state.route);

  `;
  tickClock();
}

function tickClock(){
  const el = document.getElementById('clockStat');
  const el2 = document.getElementById('lastUpdateStat');
  if(!el && !el2) return;
  const now = new Date();
  const stamp = now.toLocaleDateString('pt-BR') + ' · ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  if(el) el.innerHTML = stamp;
  if(el2) el2.textContent = stamp;
}
setInterval(()=>{ if(document.getElementById('clockStat')) tickClock(); }, 30000);

    evidence: pageEvidence, sources: pageSources, discoveries: pageDiscoveries,
    lab: pageLab, settings: pageSettings,

/* ---------- CHAT (mock responses only — no real model connected) ---------- */
const MOCK_RESPONSES = [
  "Esta versão está operando em modo de demonstração. O motor científico real ainda será conectado.",
  "Análise iniciada. Estou organizando as estratégias por mecanismo, nível de evidência e estágio de desenvolvimento — dados de exemplo por enquanto.",
  "O ranking científico real será habilitado quando o banco de evidências e o mecanismo de pesquisa forem conectados.",
  "Não tenho ainda uma base de evidências real para responder isso com precisão — esta interface está preparada para receber esse mecanismo na próxima camada.",
];
function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  state.chatHistory.push({who:'user', text});
  const reply = MOCK_RESPONSES[Math.floor(Math.random()*MOCK_RESPONSES.length)];
  state.chatHistory.push({who:'jarvis', text: reply});
  input.value = '';
  const log = document.getElementById('chatLog');
  if(log){
    log.innerHTML = state.chatHistory.map(m => `
      <div class="msg ${m.who}">${m.who==='jarvis' ? '<span class="who">JARVIS</span>' : ''}${escapeHtml(m.text)}</div>
    `).join('');
    log.scrollTop = log.scrollHeight;
  }
}

/* ---------- HYPOTHESIS ENGINE (mock structuring only) ---------- */
function generateHypothesis(){
  const q = document.getElementById('hqQuestion').value.trim() || '(pergunta não informada)';
  const ev = document.getElementById('hqEvidence').value.trim() || '(evidência não informada)';
  const mech = document.getElementById('hqMechanism').value.trim() || '(mecanismo não informado)';
  const result = document.getElementById('hypothesisResult');
  result.innerHTML = `
    <span class="badge violet" style="margin-bottom:14px"><span class="dot"></span>HYPOTHESIS — NOT VALIDATED</span>
    <div class="section-label" style="margin-top:14px">Hypothesis</div>
    <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px">${escapeHtml(q)}</p>
    <div class="section-label">Biological Rationale</div>
    <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px">${escapeHtml(mech)}</p>
    <div class="section-label">Existing Evidence</div>
    <p style="font-size:13.5px; color:var(--text-dim); margin-bottom:14px">${escapeHtml(ev)}</p>
    <div class="section-label">Unknown Variables</div>
    <p style="font-size:13.5px; color:var(--text-faint); margin-bottom:14px">PLACEHOLDER — preenchido quando o motor de análise for conectado.</p>
    <div class="section-label">Testable Prediction</div>
    <p style="font-size:13.5px; color:var(--text-faint)">PLACEHOLDER</p>
  `;
}

/* ---------- HELPERS ---------- */
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }

/* ---------- EVENT BINDING ---------- */
function bindPageEvents(){
  const genBtn = document.getElementById('btnGenHypothesis');
  if(genBtn) genBtn.addEventListener('click', generateHypothesis);

  const sendBtn = document.getElementById('btnSend');
  if(sendBtn) sendBtn.addEventListener('click', sendChat);
  const chatInput = document.getElementById('chatInput');
  if(chatInput) chatInput.addEventListener('keydown', e => {
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
  });

  document.querySelectorAll('[data-hivstage]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeHivStage = btn.dataset.hivstage;
      renderContent();
    });
  });
}

/* Global delegated events (sidebar, drawer, toggles) */
document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if(navBtn){
    navigate(navBtn.dataset.nav);
    closeMobileSidebar();
    return;
  }

  if(e.target.closest('#sbMobileToggle')){ toggleMobileSidebar(); return; }
  if(e.target.closest('#sidebarOverlay')){ closeMobileSidebar(); return; }

  if(e.target.closest('#sbToggle')){ state.sidebarCollapsed = !state.sidebarCollapsed; renderSidebar(); return; }

  if(e.target.closest('#drawerClose') || e.target.closest('#drawerOverlay')){ closeDrawer(); return; }

  const toggleBtn = e.target.closest('[data-toggle]');
  if(toggleBtn){
    const key = toggleBtn.dataset.toggle;
    state.settings[key] = !state.settings[key];
    toggleBtn.classList.toggle('on', state.settings[key]);
    toggleBtn.setAttribute('aria-checked', state.settings[key]);
    return;
  }
});

function toggleMobileSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
/* Keep the drawer/sidebar state sane if the viewport crosses the mobile breakpoint (e.g. iPad rotation, or a resizable browser window) */
window.addEventListener('resize', () => { if(window.innerWidth >= 768) closeMobileSidebar(); });

/* ---------- INIT ---------- */
navigate('home');
</script>
